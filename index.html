<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Rep.io — arena shooter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="panel">
  <div id="name">you</div>
  <div class="row"><span>Lv <b id="lvl">1</b> &middot; <span id="tier">Scout</span></span><span id="xptext">0 / 20</span></div>
  <div class="bar"><i id="xpfill"></i></div>
  <div class="row"><span>Health</span><span id="hptext">52 / 52</span></div>
  <div class="bar"><i id="hpfill"></i></div>
  <div class="row"><span>Score</span><span id="score">0</span></div>
</div>

<div id="upgrades" class="panel">
  <h3>Upgrades &middot; <span id="points">0</span> pts</h3>
  <div id="ulist"></div>
</div>

<div id="leaderboard" class="panel">
  <h3>Leaderboard</h3>
  <ol id="lb"></ol>
</div>

<div id="minimap" class="panel"><canvas id="mini"></canvas></div>

<div id="overlay">
  <div id="card" class="panel">
    <h1>Rep<span>.io</span></h1>
    <p class="sub">Eat, shoot, level up, take the top spot.</p>
    <input id="nick" maxlength="14" placeholder="nickname" autocomplete="off">
    <button id="play">Play</button>
    <p class="help">
      <b>WASD</b> / arrows to move &middot; <b>mouse</b> to aim<br>
      <b>Click</b> or <b>space</b> to shoot &middot; <b>E</b> toggles autofire<br>
      <b>1–8</b> or click to spend upgrade points
    </p>
  </div>
</div>

<script src="src/game.js"></script>
</body>
</html>
