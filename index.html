<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Rep.io — arena shooter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="name">you</div>
  <div id="sub">Lv 1 &middot; Scout</div>
  <div class="bar"><i id="xpfill"></i></div>
  <div class="bar"><i id="hpfill"></i></div>
  <div id="score">0</div>
  <div id="pop"></div>
</div>

<div id="upgrades">
  <div id="uhint">1 point</div>
  <div id="ulist"></div>
</div>

<ol id="lb"></ol>

<div id="guns"></div>

<canvas id="mini"></canvas>

<div id="overlay">
  <div id="card">
    <h1>Rep<span>.io</span></h1>
    <p class="sub">Eat, shoot, level up, take the top spot.</p>
    <p id="link" class="link"></p>
    <input id="nick" maxlength="17" placeholder="nickname" autocomplete="off" spellcheck="false">
    <p id="nameerr"></p>
    <button id="play">Play</button>
    <p class="help">
      <b>WASD</b> move &middot; <b>mouse</b> aim &middot; <b>click</b> shoot<br>
      <b>Q</b> or <b>scroll</b> swap gun &middot; <b>E</b> autofire<br>
      <b>1&ndash;7</b> upgrades &middot; <b>M</b> mute
    </p>
    <button id="mute" class="ghost">Sound on</button>
  </div>
</div>

<script src="src/sim.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
</body>
</html>
